<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>P3NROSE | Level Editor</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <main id="app" class="app" data-mode="edit">
    <div class="editor-actions">
      <div class="button-row">
        <button id="stage-add">ステージ追加</button><button id="stage-delete">ステージ削除</button><button id="test-play">テストプレイ</button><button id="json-export">JSON 書出し</button><button id="json-import">JSON 読込み</button><input id="json-file" type="file" accept=".json,application/json" hidden>
      </div>
      <div class="button-row">
        <button id="search-forced">確定配置探索</button><button id="auto-boundary">外周自動作成</button><button id="shuffle-marks">記号ランダム選択</button><button id="fixed-select">初期表示タイル選択</button><button id="rotate-board">全体を回転</button><select id="rotation-angle" aria-label="回転角度"><option value="18">18°</option><option value="36">36°</option><option value="54">54°</option><option value="72">72°</option><option value="90">90°</option><option value="180">180°</option></select><button id="reset-board">全体リセット</button>
      </div>
    </div>
    <div class="play-actions"><button id="back-to-editor">← レベルエディタに戻る</button><button id="reset-play">すべてリセット</button><button id="undo-play" disabled>UNDO</button></div>
    <aside class="stage-panel"><h1 id="stage-heading">ステージ選択</h1><div id="stage-list" class="stage-grid"></div><div class="progress-actions"><button id="reset-stage-progress" title="選択中のステージの配置とクリア記録を初期化">このステージの記録を初期化</button><button id="reset-all-progress" title="全ステージの配置とクリア記録を初期化">全ステージの記録を初期化</button></div></aside>
    <section class="board-section"><canvas id="board" aria-label="P3NROSE 盤面"></canvas><div id="rotation-controls" class="rotation-controls"></div><div class="board-footer"><button id="show-all">全体表示</button><span id="status" role="status"></span></div></section>
    <aside class="palette" aria-label="タイル置き場"><button id="thin-tray" class="tile-tray" aria-label="THIN タイルをドラッグ"><canvas id="thin-preview"></canvas></button><button id="fat-tray" class="tile-tray" aria-label="FAT タイルをドラッグ"><canvas id="fat-preview"></canvas></button></aside>
  </main>
  <canvas id="held-tile" aria-hidden="true"></canvas>
  <script type="module" src="src/ui/editor.js"></script>
</body>
</html>
